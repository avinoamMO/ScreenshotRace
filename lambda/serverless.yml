service: screenshot-race-lambda

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  timeout: 60
  memorySize: 3008
  architecture: x86_64

functions:
  screenshot:
    handler: handler.handler
    events:
      - http:
          path: screenshot
          method: post
          cors: true
      - http:
          path: screenshot
          method: options
          cors: true

package:
  patterns:
    - '!node_modules/**'
    - 'node_modules/@sparticuz/chromium/**'
    - 'node_modules/puppeteer-core/**'
    - 'handler.js'

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node20
    platform: node
    external:
      - '@sparticuz/chromium'
